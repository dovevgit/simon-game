<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App icon (DESIGN.md §2.4): round board in the board's color order, dark center, no text.
       Opaque background; the board stays inside the maskable safe zone. -->
  <rect width="512" height="512" fill="#0A1628"/>
  <circle cx="256" cy="256" r="200" fill="#0F0F0F"/>
  <clipPath id="board">
    <circle cx="256" cy="256" r="186"/>
  </clipPath>
  <g clip-path="url(#board)">
    <rect x="70" y="70" width="176" height="176" fill="#00D26A"/>
    <rect x="266" y="70" width="176" height="176" fill="#FF3B30"/>
    <rect x="70" y="266" width="176" height="176" fill="#FFD600"/>
    <rect x="266" y="266" width="176" height="176" fill="#00A3FF"/>
  </g>
  <circle cx="256" cy="256" r="64" fill="#0F0F0F"/>
</svg>
